<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Digital Clock</title>
</head>
<style>
    
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background-color: black;
    color: #ffffff;
}

.clock-container {
    width: 100%;
    padding: 24px;
}

.clock-card {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    padding: 55px 25px;
    text-align: center;
    border: 1px solid #8c97a3;
    border-radius: 28px;
    /* background: rgba(2, 12, 35, 0.55); */
    /* box-shadow: 0 0 35px rgba(0, 132, 255, 0.12); */
}

.clock-label {
    color: #94a3b8;
    font-size: 14px;
    letter-spacing: 5px;
    margin-bottom: 25px;
}

#clock {
    font-size: clamp(40px, 9vw, 100px);
    font-weight: 700;
    letter-spacing: 3px;
    color: #dae0e0;
    text-shadow: 0 0 25px rgba(34, 211, 238, 0.35);
    font-variant-numeric: tabular-nums;
}

#ampm {
    margin-top: 10px;
    color: #c2c7cc;
    font-size: 20px;
    letter-spacing: 3px;
}

.date-info {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 30px;
    color: #cbd5e1;
    font-size: 18px;
}

.separator {
    color: #a0aaac;
}

@media (max-width: 480px) {
    .clock-card {
        padding: 40px 15px;
        border-radius: 20px;
    }

    .clock-label {
        letter-spacing: 3px;
    }

    .date-info {
        font-size: 14px;
        gap: 8px;
    }
}

.HEADING-CONTAINER{
    background-color: black;
    color: wheat;
    font-weight: 700;
    font-family: 'Times New Roman', Times, serif;
    margin: 0 auto;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.HEADING{
     margin-bottom: 50PX;
     font-size: 40px;
}
.HEADING:hover
{
    color: white;
}
</style>
<body>
   


    <main class="clock-container">
         <DIV class="HEADING-CONTAINER">

    <h1 class="HEADING">JAVASCRIPT DIGITAL CLOCK PROJECT</h1>
    </DIV>
        <div class="clock-card">
            <p class="clock-label">CURRENT TIME</p>

            <h1 id="clock">00:00:00</h1>

            <p id="ampm">AM</p>

            <div class="date-info">
                <span id="day">Thursday</span>
                <span class="separator">•</span>
                <span id="date">October 29, 2026</span>
            </div>
        </div>
    </main>

    <script>
       

function updateClock() {
    // Get the current date and time
    const now = new Date();

    // Get hours, minutes, and seconds
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const seconds = String(now.getSeconds()).padStart(2, "0");

    // Convert 24-hour time to 12-hour time
    const ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12 || 12;
    hours = String(hours).padStart(2, "0");

    // Display the time
    document.getElementById("clock").textContent =
        `${hours}:${minutes}:${seconds}`;

    document.getElementById("ampm").textContent = ampm;

    // Display the day and date
    document.getElementById("day").textContent =
        now.toLocaleDateString("en-US", {
            weekday: "long"
        });

    document.getElementById("date").textContent =
        now.toLocaleDateString("en-US", {
            month: "long",
            day: "numeric",
            year: "numeric"
        });
}

// Show the time immediately
updateClock();

// Update the clock every second
setInterval(updateClock, 1000);


    </script>
</body>
</html>
